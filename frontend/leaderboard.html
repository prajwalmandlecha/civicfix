<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard - CivicFix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- <link rel="stylesheet" href="/style.css"> -->
  <link rel="stylesheet" href="/styles/leaderboard.css">
  <link rel="stylesheet" href="styles/dark-mode.css" />
</head>

<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="nav-logo">
        <span class="logo-icon">
          <img src="assets/logo.png">
        </span>
        <span class="logo-text">CivicFix</span>
      </a>
      <button class="mobile-menu-toggle" id="mobile-menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-menu" id="nav-menu">
      </ul>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon">☀️</span>
      </button>
    </div>
  </nav>

  <section class="page-content street-rise">
    <div class="container">
      <h1 class="page-title">🏆 Leaderboard</h1>
      <p class="page-subtitle">Community Champions</p>

      <div class="leaderboard-tabs">
        <button class="tab-btn active" data-tab="citizen">👤 Citizen Karma</button>
        <button class="tab-btn" data-tab="ngo">🏢 NGO Karma</button>
      </div>

      <div class="leaderboard-content">
        <div class="tab-panel active" id="citizen-panel">
          <div class="podium" id="citizen-podium">
            <!-- Podium will be populated dynamically -->
          </div>

          <div class="leaderboard-list" id="citizen-list">
            <div class="loading-spinner"></div>
          </div>
        </div>

        <div class="tab-panel" id="ngo-panel">
          <div class="podium" id="ngo-podium">
            <!-- Podium will be populated dynamically -->
          </div>

          <div class="leaderboard-list" id="ngo-list">
            <div class="loading-spinner"></div>
          </div>
        </div>
      </div>

      <div class="download-sticky">
        <p>Want to climb the ranks?</p>
        <button class="download-app-btn">📱 Download App</button>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 CivicFix. Built with ❤️ for better cities.</p>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <script type="module" src="/pages/leaderboard.js"></script>
</body>

</html>
